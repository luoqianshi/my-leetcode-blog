<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>070. 爬楼梯 — 算法图解</title>
<style>
/* ============================================================
   图解演示 — 设计令牌（单一真源）
   与 docs/.vitepress/theme/styles/custom.css 第 8-116 行保持一致。
   iframe 是独立 document，无法继承父页样式，故此处刻意重复。
   改动 custom.css 的令牌后，需重跑 scripts/create-demo.mjs 同步。
   ============================================================ */

:root {
  /* 色彩 — Cursor 浅色基调 */
  --lc-bg: #ffffff;
  --lc-bg-soft: #fafafa;
  --lc-bg-mute: #f0f0f2;
  --lc-ink: #0a0a0a;
  --lc-text-2: #52525b;
  --lc-text-3: #a1a1aa;
  --lc-border: rgba(0, 0, 0, 0.08);
  --lc-border-strong: rgba(0, 0, 0, 0.16);
  --lc-accent: #4f46e5;
  --lc-accent-soft: rgba(79, 70, 229, 0.08);

  /* 难度语义色 */
  --lc-green: #10b981;
  --lc-green-bg: rgba(16, 185, 129, 0.1);
  --lc-orange: #f59e0b;
  --lc-orange-bg: rgba(245, 158, 11, 0.1);
  --lc-red: #ef4444;
  --lc-red-bg: rgba(239, 68, 68, 0.1);

  /* 字体 */
  --lc-font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont,
    'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --lc-font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;

  /* 圆角 */
  --lc-radius-sm: 6px;
  --lc-radius-md: 10px;
  --lc-radius-lg: 14px;
  --lc-radius-pill: 999px;

  /* 动效 */
  --lc-ease: cubic-bezier(0.16, 1, 0.3, 1);
  --lc-ring: 0 0 0 3px rgba(79, 70, 229, 0.15);

  /* demo 专属 —— 不与站点令牌冲突 */
  --dm-cell: 46px;       /* 数组格子边长 */
  --dm-node-r: 19px;     /* 树 / 链表节点半径 */
  --dm-grid: 40px;       /* 网格单元格边长 */
  --dm-dur: 260ms;       /* 过渡时长 */
  --dm-stroke: 1.6;
  --dm-stage-minw: 0px;  /* 窄屏时舞台横向滚动的触发宽度，由 archetype 覆盖 */
}

/* 注意：--lc-green / --lc-orange / --lc-red 三个主色在站点的 html.dark 里
   同样没有被覆盖（只有 -bg 变体被覆盖），此处保持一致以免色偏。 */
html.dark {
  --lc-bg: #0a0a0a;
  --lc-bg-soft: #131316;
  --lc-bg-mute: #1f1f23;
  --lc-ink: #fafafa;
  --lc-text-2: #a1a1aa;
  --lc-text-3: #6b6b74;
  --lc-border: rgba(255, 255, 255, 0.1);
  --lc-border-strong: rgba(255, 255, 255, 0.2);
  --lc-accent: #818cf8;
  --lc-accent-soft: rgba(129, 140, 248, 0.12);
  --lc-green-bg: rgba(16, 185, 129, 0.15);
  --lc-orange-bg: rgba(245, 158, 11, 0.15);
  --lc-red-bg: rgba(239, 68, 68, 0.15);
  --lc-ring: 0 0 0 3px rgba(129, 140, 248, 0.25);
  --dm-stroke: 1.4;
}

/* ============================================================
   外壳样式 —— 全部 archetype 共用
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

/* 🔴 height 必须是 auto。设成 100% / 100vh 会让父页设定 iframe 高度时
      #app 跟着变高 → ResizeObserver 再触发 → 无限上报死循环。 */
html, body { margin: 0; padding: 0; height: auto; }

body {
  background: var(--lc-bg);
  color: var(--lc-ink);
  font-family: var(--lc-font-sans);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

#app { height: auto; padding: 16px; }

.demo-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.demo-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }

.stage {
  overflow-x: auto;
  overflow-y: hidden;
  padding: 8px;
  border: 1px solid var(--lc-border);
  border-radius: var(--lc-radius-md);
  background: var(--lc-bg-soft);
}
#svg { display: block; width: 100%; height: auto; min-width: var(--dm-stage-minw); }

.caption {
  margin: 12px 2px 0;
  min-height: 3.2em;
  font-size: 13px;
  line-height: 1.6;
  color: var(--lc-text-2);
}

.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 30px;
  min-width: 30px;
  padding: 0 10px;
  border: 1px solid var(--lc-border);
  border-radius: var(--lc-radius-sm);
  background: var(--lc-bg);
  color: var(--lc-ink);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: border-color 140ms var(--lc-ease), background 140ms var(--lc-ease), opacity 140ms var(--lc-ease);
}
.btn:hover:not(:disabled) { border-color: var(--lc-border-strong); background: var(--lc-bg-soft); }
.btn:focus-visible { outline: none; box-shadow: var(--lc-ring); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn svg { display: block; }

.btn-primary {
  min-width: 64px;
  background: var(--lc-ink);
  border-color: var(--lc-ink);
  color: var(--lc-bg);
}
.btn-primary:hover:not(:disabled) { background: var(--lc-text-2); border-color: var(--lc-text-2); }

.scrub {
  flex: 1 1 120px;
  min-width: 90px;
  height: 30px;
  margin: 0;
  accent-color: var(--lc-accent);
  cursor: pointer;
}
.scrub:focus-visible { outline: none; box-shadow: var(--lc-ring); border-radius: var(--lc-radius-sm); }

.count {
  font-family: var(--lc-font-mono);
  font-size: 11px;
  color: var(--lc-text-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.demo-foot { margin: 10px 2px 0; font-size: 11px; color: var(--lc-text-3); }

/* ---------- SVG 共享视觉词汇（archetype 只补充自己特有的类） ---------- */

#svg text { font-family: var(--lc-font-mono); font-variant-numeric: tabular-nums; }

.lbl { font-size: 12px; fill: var(--lc-text-2); }
.lbl-strong { font-size: 12px; font-weight: 600; fill: var(--lc-ink); }
.lbl-dim { font-size: 11px; fill: var(--lc-text-3); }

.cell { fill: var(--lc-bg); stroke: var(--lc-border-strong); stroke-width: var(--dm-stroke); }
.cell-done { fill: var(--lc-bg-mute); stroke: var(--lc-border); }
.cell-active { fill: var(--lc-accent-soft); stroke: var(--lc-accent); }
.cell-hit { fill: var(--lc-green-bg); stroke: var(--lc-green); }
.cell-val { font-size: 15px; font-weight: 600; fill: var(--lc-ink); text-anchor: middle; }
.cell-idx { font-size: 10px; fill: var(--lc-text-3); text-anchor: middle; }

.node { fill: var(--lc-bg); stroke: var(--lc-border-strong); stroke-width: var(--dm-stroke); }
.node-active { fill: var(--lc-accent-soft); stroke: var(--lc-accent); }
.node-done { fill: var(--lc-green-bg); stroke: var(--lc-green); }
.node-dim { opacity: 0.3; }
.node-val { font-size: 14px; font-weight: 600; fill: var(--lc-ink); text-anchor: middle; }

.edge { fill: none; stroke: var(--lc-border-strong); stroke-width: var(--dm-stroke); }
.edge-active { stroke: var(--lc-accent); }
.edge-done { stroke: var(--lc-green); }

.ptr-arrow { fill: var(--lc-accent); }
.ptr-label { font-size: 11px; font-weight: 600; fill: var(--lc-accent); text-anchor: middle; }
.ptr-prev .ptr-arrow, .ptr-prev .ptr-label { fill: var(--lc-green); }
.ptr-next .ptr-arrow, .ptr-next .ptr-label { fill: var(--lc-orange); }

.chip-bg { fill: var(--lc-bg-mute); stroke: var(--lc-border); stroke-width: 1; }
.chip-tx { font-size: 11px; fill: var(--lc-text-2); text-anchor: middle; }
.chip-new .chip-bg { fill: var(--lc-accent-soft); stroke: var(--lc-accent); }
.chip-new .chip-tx { fill: var(--lc-accent); font-weight: 600; }

.badge-bg { fill: var(--lc-green-bg); stroke: var(--lc-green); stroke-width: 1; }
.badge-tx { font-size: 10px; font-weight: 600; fill: var(--lc-green); text-anchor: middle; }

.panel-bg { fill: var(--lc-bg); stroke: var(--lc-border); stroke-width: 1; }
.panel-title { font-size: 10px; font-weight: 600; fill: var(--lc-text-3); letter-spacing: 0.04em; }

/* 只用 opacity 做入场脉冲：CSS transform 会覆盖 SVG 的 transform 属性，
   而定位恰恰依赖该属性，所以这里绝不动 transform。 */
@keyframes dm-fade-in { from { opacity: 0; } to { opacity: 1; } }
.chip-new { animation: dm-fade-in 320ms var(--lc-ease); }

@media (max-width: 640px) {
  #app { padding: 12px; }
  .demo-foot { display: none; }
  .count { display: none; }
}

.no-motion *, .no-motion *::before, .no-motion *::after {
  transition: none !important;
  animation: none !important;
}

/* ============================================================
   archetype: dp-table —— DP 表（柱状递推）专用样式
   只补 shell.html 里没有的东西：柱子生长、槽位轨道、依赖箭头头部、
   台阶示意。共用词汇（.edge / .edge-active / .edge-done / .chip-bg /
   .badge-bg / .cell-idx / .lbl-dim / .panel-title）一律沿用外壳，不重复定义。
   ============================================================ */

/* 柱子填色单独开一套令牌：浅色底用深靛蓝，暗色底必须换成 --lc-accent 那一档
   亮靛蓝 —— 直接写死 rgba(79,70,229,…) 的话在 #0a0a0a 上几乎看不见。
   （--lc-orange / --lc-green 主色两版一致，故描边可以直接用令牌。） */
:root {
  --dm-dp-base-fill: rgba(245, 158, 11, 0.22);
  --dm-dp-rec-fill: rgba(79, 70, 229, 0.20);
  --dm-dp-write-fill: rgba(79, 70, 229, 0.38);
  --dm-dp-ans-fill: rgba(16, 185, 129, 0.30);
}

html.dark {
  --dm-dp-base-fill: rgba(245, 158, 11, 0.28);
  --dm-dp-rec-fill: rgba(129, 140, 248, 0.26);
  --dm-dp-write-fill: rgba(129, 140, 248, 0.44);
  --dm-dp-ans-fill: rgba(16, 185, 129, 0.34);
}

/* 还没算出来的槽位：只留虚线轮廓。所有轨道都是满刻度高，顺带把
   「柱高按最终值定标、不按当前最大值」这件事画在图上。 */
.dp-track { fill: none; stroke: var(--lc-border-strong); stroke-width: 1; stroke-dasharray: 3 4; opacity: 0.5; }
.dp-track-on { stroke: var(--lc-accent); stroke-dasharray: 5 4; opacity: 1; }

/* 🔴 柱子生长走 scaleY，必须显式给 transform-box: fill-box + origin 100%：
      SVG 元素的默认参考系是 viewBox（原点落在整块画布中心），少了这两行
      柱子会从画面中间往两头长。transition 不在这里写 —— ensure() 已经用
      内联样式统一挂上了，重复声明反而会被内联覆盖。 */
.dp-bar {
  stroke-width: 1.4;
  transform-box: fill-box;
  transform-origin: 50% 100%;
}
.dp-bar-pending { fill: none; stroke: none; }
.dp-bar-base { fill: var(--dm-dp-base-fill); stroke: var(--lc-orange); }
.dp-bar-rec { fill: var(--dm-dp-rec-fill); stroke: var(--lc-accent); }
.dp-bar-write { fill: var(--dm-dp-write-fill); stroke: var(--lc-accent); stroke-width: 2; }
.dp-bar-ans { fill: var(--dm-dp-ans-fill); stroke: var(--lc-green); stroke-width: 2; }
.dp-bar-read { stroke-width: 2.6; }

/* 柱顶数值：矮柱子放柱子上方，高柱子放柱子内部（见 paint 里的 24px 阈值） */
.dp-val { font-size: 13px; font-weight: 600; fill: var(--lc-ink); text-anchor: middle; }
.dp-val-dim { font-size: 13px; fill: var(--lc-text-3); text-anchor: middle; }
.dp-val-read { font-size: 13px; font-weight: 700; fill: var(--lc-accent); text-anchor: middle; }
.dp-val-write { font-size: 13px; font-weight: 700; fill: var(--lc-accent); text-anchor: middle; }
.dp-val-ans { font-size: 13px; font-weight: 700; fill: var(--lc-green); text-anchor: middle; }

.dp-idx-on { fill: var(--lc-accent); font-weight: 600; }

/* 等式读数：本题的数值主线，比 .chip-tx 大一号才压得住 */
.dp-eq { font-size: 12px; font-weight: 600; fill: var(--lc-text-2); text-anchor: middle; }
.dp-eq-done { fill: var(--lc-green); }

.dp-axis { stroke: var(--lc-border-strong); stroke-width: 1.2; }

/* 依赖箭头的头部（.edge 只负责线，不负责填充） */
.dp-head { fill: var(--lc-accent); }
.dp-head-done { fill: var(--lc-green); }

/* 台阶示意：只是助记符，刻意做小；+2 那一跳用虚线，色弱也能分辨 */
.dp-stair { fill: var(--lc-bg-mute); stroke: var(--lc-border-strong); stroke-width: 1.2; }
.dp-stair-top { fill: none; stroke: var(--lc-accent); stroke-width: 2.4; stroke-linecap: round; }
.dp-hop { fill: none; stroke: var(--lc-accent); stroke-width: 1.6; stroke-linecap: round; }
.dp-hop-2 { stroke: var(--lc-orange); stroke-dasharray: 4 3; }
.dp-hop-dot { fill: var(--lc-accent); }
.dp-hop-tx { font-size: 9px; font-weight: 600; text-anchor: middle; }
.dp-hop-tx-1 { fill: var(--lc-accent); }
.dp-hop-tx-2 { fill: var(--lc-orange); }

/* 图例小色块 */
.dp-sw { stroke-width: 1.2; }
.dp-sw-base { fill: var(--dm-dp-base-fill); stroke: var(--lc-orange); }
.dp-sw-rec { fill: var(--dm-dp-rec-fill); stroke: var(--lc-accent); }
</style>
<script>
/* 主题引导：首次绘制前同步执行，消除暗色闪烁。
   嵌入站点时与父页同源 → 读到的就是父站偏好；
   双击 file:// 离线打开时 → Chrome 会对 localStorage 抛 SecurityError，
   此时必须退化为系统 prefers-color-scheme，所以两个取值分开 try。
   判定顺序与 docs/.vitepress/config.ts 的 FAVICON_BOOTSTRAP 等价。 */
(function () {
  var dark = false;
  try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (_) {}
  try {
    var e = localStorage.getItem('vitepress-theme-appearance');
    if (e === 'dark') dark = true;
    else if (e === 'light') dark = false;
    /* null / 'auto' → 沿用系统偏好 */
  } catch (_) { /* file:// 下拿不到 localStorage，沿用系统偏好 */ }
  if (dark) document.documentElement.classList.add('dark');
})();
</script>
</head>
<body>
<div id="app">
  <div class="demo" data-slug="070-climbing-stairs">

    <header class="demo-head">
      <span class="demo-title">070. 爬楼梯</span>
    </header>

    <div class="stage" id="stage">
      <svg id="svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="070. 爬楼梯 算法分步动画"></svg>
    </div>

    <p class="caption" id="caption" aria-live="polite"></p>

    <div class="bar" role="group" aria-label="播放控制">
      <button id="btn-reset" class="btn" type="button" title="重置 (R)" aria-label="重置">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

<script>
/* ⚠️ 不能写 type="module"：Chrome 会以 CORS 为由拒绝执行 file:// 上的 ES 模块，
      双击离线打开直接白屏。必须是经典内联脚本，且不含 import / 外部 src / fetch。 */
(function () {
  'use strict';
  var SLUG = '070-climbing-stairs';

/* ============================================================
   archetype: dp-table
   参考实现 = 070. 爬楼梯（n = 6 → 13），严格照题解页「## 代码实现」那段 Python：

     dp = {0:0}          # 🔴 dp[0] = 0，不是教科书里的 1
     dp[1] = 1
     dp[2] = 2
     for i in range(3, n+1):
         dp[i] = dp[i-1] + dp[i-2]
     return dp[n]

   这是「DP 表 + 柱状递推 + 依赖箭头」家族的样板；爬楼梯 / 使用最小花费爬楼梯 /
   打家劫舍 / 斐波那契数 / 第 N 个泰波那契数 等一维填表题都从它改起，
   二维填表题（不同路径 / 最小路径和）把一根柱子换成一行格子即可。

   🔴 忠实度优先：容器是字典就画字典，两个基础值都写死就从 i = 3 开始循环。
      读者刚看完上面那段代码，图画错了比不画更糟。

   ⚠️ 用法：脚手架把本文件内联进 docs/public/demos/<slug>/index.html 之后，
   直接改**产物文件**里的 N / buildSteps() / paint()。
   不要改本模板 —— 它是样板，不是运行时依赖。
   ============================================================ */

var N = 6;                              // 题目输入：爬到第 6 阶
var STAGE = { w: 680, h: 350, minW: 560 };

var steps = [];

function record(patch, caption) {
  patch.caption = caption;
  steps.push(patch);
}

function cloneDp(o) {
  var r = {};
  for (var k in o) r[k] = o[k];
  return r;
}

/* ---------- 录制：真跑一遍那段 Python，每步存一份纯数据快照 ----------
   🔴 dp 必须每次拷贝（cloneDp）。直接存引用的话所有步骤会指向同一个不断变化的
      字典，动画就变成「每一步都显示最终态」。src / grid / nodes 同理。
   🔴 这里刻意用「对象」而不是「数组」装 dp：一是 Python 原文就是 dict，
      二是 check-demo 的元素级引用探针假定容器里装的是行对象，扁平数字数组
      会被它当成「两步共享引用」误报。key = 下标，value = 方法数，
      「这个下标还没算」就表现为「没有这个 key」。 */
function buildSteps() {
  var dp = {};

  dp[0] = 0;
  record({ phase: 'init', i: 0, dp: cloneDp(dp), src: null },
    'dp = {0: 0} —— 这份实现把「0 阶台阶」记作 0 种走法（教科书常写 dp[0] = 1，' +
    '那是把「原地不动」也算一种）。循环从 i = 3 起、只读 dp[i-1] 和 dp[i-2]，' +
    '所以 n ≥ 1 时 dp[0] 根本读不到，填 0 还是 1 都不影响答案 —— 柱高也就是 0，第 0 根柱子是空的。');

  dp[1] = 1;
  record({ phase: 'init', i: 1, dp: cloneDp(dp), src: null },
    'dp[1] = 1 —— 只有「直接跨 1 阶」这一种走法。它是写死的基础值、不由递推得出，所以柱子换一种颜色。');

  dp[2] = 2;
  record({ phase: 'init', i: 2, dp: cloneDp(dp), src: null },
    'dp[2] = 2 —— 「1 + 1」和「一次跨 2 阶」两种走法。两个基础值都预先给好，' +
    '所以 for i in range(3, n+1) 是从 i = 3 才开始的（只给一个基础值的版本才从 i = 2 起）。');

  for (var i = 3; i <= N; i++) {
    var a = dp[i - 1], b = dp[i - 2];

    record({ phase: 'read', i: i, dp: cloneDp(dp), src: [i - 1, i - 2] },
      '要算 dp[' + i + ']，读 dp[' + (i - 1) + '] = ' + a + ' 和 dp[' + (i - 2) + '] = ' + b +
      ' —— 到第 ' + i + ' 阶要么从第 ' + (i - 1) + ' 阶跨 1 步，要么从第 ' + (i - 2) +
      ' 阶跨 2 步，两类走法互不重叠，所以相加。');

    dp[i] = a + b;
    record({ phase: 'write', i: i, dp: cloneDp(dp), src: [i - 1, i - 2] },
      'dp[' + i + '] = dp[' + (i - 1) + '] + dp[' + (i - 2) + '] = ' + a + ' + ' + b + ' = ' +
      dp[i] + '，写回字典，柱子长到 ' + dp[i] + '。每格只依赖左边两格，所以一趟从左到右就能填完，时间 O(n)。');
  }

  record({ phase: 'done', i: N, dp: cloneDp(dp), src: null },
    'i 走到 n = ' + N + ' 之后循环结束，return dp[' + N + '] = ' + dp[N] +
    '。（页面要点说的「空间优化为两个变量」指只滚动保留前两个值、把空间降到 O(1)；' +
    '这份代码实际用的是字典，动画照代码画。）');
}

buildSteps();

/* 🔴 柱高按「最终值」定标：buildSteps() 跑完拿 dp[N] = 13 当满刻度，
      而不是按当前最大值 —— 否则每写一格所有柱子都要重新缩放，整张图一起抖。 */
var MAXV = steps[steps.length - 1].dp[N];

/* ---------- 渲染 ----------
   🔴 绝不每步 innerHTML 重建 —— 那会杀掉所有 CSS transition，动画就没了。
      用 keyed 元素缓存：首帧创建，之后只改 class / transform / textContent。
      柱子生长走 scaleY，位移一律走 style.transform 而非重设 x/y 属性。 */

var NS = 'http://www.w3.org/2000/svg';
var cache = Object.create(null);
var picto = null;                 // 台阶示意的子元素只建一次

var BAR_W = 56, GAP = 24, BASE_Y = 290, MAX_H = 130;
var SLOTS = N + 1;                // dp[0..N] 共 7 根柱子
var X0 = (STAGE.w - (SLOTS * BAR_W + (SLOTS - 1) * GAP)) / 2;
var PICTO_Y = 34;                 // 台阶示意所在横带的顶部
var SRC_LIFT = 30;                // 依赖箭头起点抬到柱顶数值标签之上
var IDX_Y = 306, EQ_Y = 316, LEG_Y = 322;

function bx(k) { return X0 + k * (BAR_W + GAP); }       // 第 k 根柱子左边缘
function cx(k) { return bx(k) + BAR_W / 2; }            // 第 k 根柱子中线
function barH(v) { return v / MAXV * MAX_H; }
function barTop(v) { return BASE_Y - barH(v); }

function ensure(key, tag) {
  var e = cache[key];
  if (!e) {
    e = document.createElementNS(NS, tag);
    e.style.transition = 'transform var(--dm-dur) var(--lc-ease),' +
      ' opacity var(--dm-dur) var(--lc-ease),' +
      ' fill var(--dm-dur) var(--lc-ease),' +
      ' stroke var(--dm-dur) var(--lc-ease)';
    cache[key] = e;
    svg.appendChild(e);
  }
  return e;
}

function attr(e, o) { for (var k in o) e.setAttribute(k, o[k]); }
function txt(e, s) { if (e.textContent !== s) e.textContent = s; }

/* 清掉上一步残留的动态元素（本 archetype 的元素都是常驻的，这里是保险丝） */
function reconcile(used) {
  for (var k in cache) {
    if (!used[k]) { cache[k].remove(); delete cache[k]; }
  }
}

/* 台阶示意：3 级台阶 + 两跳（+1 实线 / +2 虚线），都落在最高那级 = 第 i 阶。
   局部坐标以「最高级台阶正下方」为原点，整块靠 style.transform 平移到当前柱上方。 */
function ensurePicto() {
  if (picto) return picto;
  var g = document.createElementNS(NS, 'g');
  g.style.transition = 'transform var(--dm-dur) var(--lc-ease),' +
    ' opacity var(--dm-dur) var(--lc-ease)';

  var stair = document.createElementNS(NS, 'path');
  attr(stair, {
    class: 'dp-stair',
    d: 'M-22.5 62 L-22.5 50 L-7.5 50 L-7.5 38 L7.5 38 L7.5 26 L22.5 26 L22.5 62 Z'
  });
  var top = document.createElementNS(NS, 'path');      // 最高一级 = 第 i 阶
  attr(top, { class: 'dp-stair-top', d: 'M8.5 26 L21.5 26' });

  var hop2 = document.createElementNS(NS, 'path');     // 从 i-2 跨 2 阶
  attr(hop2, { class: 'dp-hop dp-hop-2', d: 'M-15 47 Q0 5 15 23' });
  var hop1 = document.createElementNS(NS, 'path');     // 从 i-1 跨 1 阶
  attr(hop1, { class: 'dp-hop', d: 'M0 35 Q7.5 19 15 23' });

  var dot = document.createElementNS(NS, 'circle');
  attr(dot, { class: 'dp-hop-dot', cx: 15, cy: 23, r: 2.6 });

  var t2 = document.createElementNS(NS, 'text');
  attr(t2, { class: 'dp-hop-tx dp-hop-tx-2', x: -13, y: 11 });
  txt(t2, '+2');
  var t1 = document.createElementNS(NS, 'text');
  attr(t1, { class: 'dp-hop-tx dp-hop-tx-1', x: 14, y: 12 });
  txt(t1, '+1');

  g.appendChild(stair);
  g.appendChild(top);
  g.appendChild(hop2);
  g.appendChild(hop1);
  g.appendChild(dot);
  g.appendChild(t2);
  g.appendChild(t1);

  cache.picto = g;                // 交给 reconcile 统一管
  svg.appendChild(g);
  picto = g;
  return g;
}

function paint(s) {
  var used = Object.create(null);
  var k, e;

  /* 顶部标题 + n 药丸（静态） */
  e = ensure('title', 'text'); used.title = 1;
  attr(e, { x: 8, y: 24, class: 'panel-title' });
  txt(e, 'DP 表 · dp[i] = 走到第 i 阶的方法数');

  e = ensure('n-bg', 'rect'); used['n-bg'] = 1;
  attr(e, { x: STAGE.w - 96, y: 8, width: 88, height: 24, rx: 12, class: 'chip-bg' });
  e = ensure('n-tx', 'text'); used['n-tx'] = 1;
  attr(e, { x: STAGE.w - 52, y: 24, class: 'chip-tx' });
  txt(e, 'n = ' + N);

  /* 基线 + 下标行说明 */
  e = ensure('axis', 'line'); used.axis = 1;
  attr(e, { x1: X0 - 8, y1: BASE_Y, x2: bx(N) + BAR_W + 8, y2: BASE_Y, class: 'dp-axis' });

  e = ensure('axis-lbl', 'text'); used['axis-lbl'] = 1;
  attr(e, { x: 8, y: IDX_Y, class: 'lbl-dim' });
  txt(e, '下标 i');

  /* 柱子：轨道（满刻度虚线）+ 柱体（scaleY 生长）+ 柱顶数值 + 下标 */
  for (k = 0; k <= N; k++) {
    var v = s.dp[k];
    var has = v !== undefined;                      // 字典里还没这个 key = 还没算
    var isSrc = !!(s.src && (s.src[0] === k || s.src[1] === k));
    var isTgt = (s.i === k && s.phase !== 'done');
    var isAns = (s.i === k && s.phase === 'done');

    e = ensure('t' + k, 'rect'); used['t' + k] = 1;
    attr(e, {
      x: bx(k), y: BASE_Y - MAX_H, width: BAR_W, height: MAX_H, rx: 4,
      class: 'dp-track' + (isTgt ? ' dp-track-on' : '')
    });

    /* 柱体永远是满刻度高，靠 scaleY 从基线往上长（transform-origin 见 CSS） */
    var barCls = 'dp-bar';
    if (isAns) barCls += ' dp-bar-ans';
    else if (!has) barCls += ' dp-bar-pending';
    else if (isTgt) barCls += ' dp-bar-write';
    else if (k <= 2) barCls += ' dp-bar-base';       // dp[0..2] 是写死的基础值
    else barCls += ' dp-bar-rec';                    // dp[3..] 由递推得出
    if (isSrc && has) barCls += ' dp-bar-read';

    e = ensure('b' + k, 'rect'); used['b' + k] = 1;
    attr(e, { x: bx(k), y: BASE_Y - MAX_H, width: BAR_W, height: MAX_H, rx: 3, class: barCls });
    e.style.transform = 'scaleY(' + (has ? barH(v) / MAX_H : 0) + ')';

    /* 数值：高柱子塞进柱子内部，矮柱子放柱子上方（否则会和依赖箭头打架） */
    var valCls, valTx, valY;
    if (!has) { valCls = 'dp-val-dim'; valTx = '—'; valY = BASE_Y - 8; }
    else {
      valY = barH(v) >= 24 ? barTop(v) + 18 : barTop(v) - 8;
      valTx = String(v);
      valCls = isAns ? 'dp-val-ans' : (isSrc ? 'dp-val-read' : (isTgt ? 'dp-val-write' : 'dp-val'));
    }
    e = ensure('v' + k, 'text'); used['v' + k] = 1;
    attr(e, { x: cx(k), y: 0, class: valCls });
    e.style.transform = 'translate(0px,' + valY + 'px)';
    txt(e, valTx);

    e = ensure('d' + k, 'text'); used['d' + k] = 1;
    attr(e, { x: cx(k), y: 0, class: 'cell-idx' + (isTgt || isAns ? ' dp-idx-on' : '') });
    e.style.transform = 'translate(0px,' + IDX_Y + 'px)';
    txt(e, String(k));
  }

  /* 依赖箭头：dp[i-1] 和 dp[i-2] 两条弧线汇进 dp[i]，把转移方程画出来。
     汇聚点取「两个来源柱顶、目标柱顶」三者最高处再抬 26px，
     这样 read / write 两相位置一致（不会跳），且永远压不到柱顶数值。 */
  var fa = ensure('flow-a', 'path'); used['flow-a'] = 1;
  var fb = ensure('flow-b', 'path'); used['flow-b'] = 1;
  var fd = ensure('flow-drop', 'path'); used['flow-drop'] = 1;
  var fh = ensure('flow-head', 'path'); used['flow-head'] = 1;
  if (s.src) {
    var xi = cx(s.i);
    var v1 = s.dp[s.src[0]], v2 = s.dp[s.src[1]];
    var y1 = barTop(v1) - SRC_LIFT, y2 = barTop(v2) - SRC_LIFT;
    var convY = Math.min(y1, y2, barTop(v1 + v2)) - 26;
    var done = s.phase === 'write';
    var lineCls = 'edge ' + (done ? 'edge-done' : 'edge-active');

    attr(fa, { class: lineCls, d: 'M' + cx(s.src[0]) + ' ' + y1 + ' Q' + cx(s.src[0]) + ' ' + convY + ' ' + xi + ' ' + convY });
    attr(fb, { class: lineCls, d: 'M' + cx(s.src[1]) + ' ' + y2 + ' Q' + cx(s.src[1]) + ' ' + convY + ' ' + xi + ' ' + convY });
    attr(fd, { class: lineCls, 'stroke-dasharray': '3 3', d: 'M' + xi + ' ' + convY + ' L' + xi + ' ' + (convY + 9) });
    attr(fh, {
      class: done ? 'dp-head dp-head-done' : 'dp-head',
      d: 'M0 0 L-5 -9 L5 -9 Z',
      transform: 'translate(' + xi + ',' + (convY + 18) + ')'
    });
    fa.style.opacity = fb.style.opacity = fd.style.opacity = fh.style.opacity = '1';
  } else {
    fa.style.opacity = fb.style.opacity = fd.style.opacity = fh.style.opacity = '0';
  }

  /* 台阶示意：滑到当前柱正上方（夹一下，防止最右柱把它推出 viewBox） */
  e = ensurePicto(); used.picto = 1;
  var px = Math.max(30, Math.min(STAGE.w - 30, cx(s.i)));
  e.style.transform = 'translate(' + px + 'px,' + PICTO_Y + 'px)';

  /* 等式读数：本题的数值主线，末步换成绿色徽章 */
  var eqLine;
  if (s.phase === 'init') eqLine = s.i === 0 ? 'dp = {0: 0}' : 'dp[' + s.i + '] = ' + s.dp[s.i];
  else if (s.phase === 'read') eqLine = 'dp[' + s.i + '] = dp[' + s.src[0] + '] + dp[' + s.src[1] + '] = ?';
  else if (s.phase === 'write') {
    eqLine = 'dp[' + s.i + '] = dp[' + s.src[0] + '] + dp[' + s.src[1] + '] = ' +
      s.dp[s.src[0]] + ' + ' + s.dp[s.src[1]] + ' = ' + s.dp[s.i];
  } else eqLine = 'return dp[' + N + '] = ' + s.dp[N];

  e = ensure('eq-bg', 'rect'); used['eq-bg'] = 1;
  attr(e, {
    x: STAGE.w / 2 - 160, y: EQ_Y, width: 320, height: 26, rx: 13,
    class: s.phase === 'done' ? 'badge-bg' : 'chip-bg'
  });
  e = ensure('eq-tx', 'text'); used['eq-tx'] = 1;
  attr(e, { x: 0, y: 0, class: 'dp-eq' + (s.phase === 'done' ? ' dp-eq-done' : '') });
  e.style.transform = 'translate(' + (STAGE.w / 2) + 'px,' + (EQ_Y + 17) + 'px)';
  txt(e, eqLine);

  /* 图例：区分「写死的基础值」和「递推算出来的」 */
  e = ensure('lg1-sw', 'rect'); used['lg1-sw'] = 1;
  attr(e, { x: 8, y: LEG_Y, width: 11, height: 11, rx: 3, class: 'dp-sw dp-sw-base' });
  e = ensure('lg1-tx', 'text'); used['lg1-tx'] = 1;
  attr(e, { x: 0, y: 0, class: 'lbl-dim' });
  e.style.transform = 'translate(24px,' + (LEG_Y + 10) + 'px)';
  txt(e, '基础值');

  e = ensure('lg2-sw', 'rect'); used['lg2-sw'] = 1;
  attr(e, { x: 76, y: LEG_Y, width: 11, height: 11, rx: 3, class: 'dp-sw dp-sw-rec' });
  e = ensure('lg2-tx', 'text'); used['lg2-tx'] = 1;
  attr(e, { x: 0, y: 0, class: 'lbl-dim' });
  e.style.transform = 'translate(92px,' + (LEG_Y + 10) + 'px)';
  txt(e, '递推得出');

  reconcile(used);
}

/* ============================================================
   KERNEL —— 主题通信 + 播放控制 + 高度上报（全部 archetype 共用）

   契约：ARCH 段必须提供
     var steps            快照数组，每项含 phase / caption 及 archetype 专属字段
     function paint(s)    渲染一帧快照
   可选提供
     var STAGE = { w, h, minW }   viewBox 尺寸；minW 为窄屏横向滚动触发宽度
   ============================================================ */

var CFG = (typeof STAGE !== 'undefined' && STAGE) ? STAGE : { w: 660, h: 300, minW: 0 };

var app = document.getElementById('app');
var svg = document.getElementById('svg');
svg.setAttribute('viewBox', '0 0 ' + CFG.w + ' ' + CFG.h);
if (CFG.minW) document.documentElement.style.setProperty('--dm-stage-minw', CFG.minW + 'px');

var el = {
  prev: document.getElementById('btn-prev'),
  play: document.getElementById('btn-play'),
  next: document.getElementById('btn-next'),
  reset: document.getElementById('btn-reset'),
  speed: document.getElementById('btn-speed'),
  scrub: document.getElementById('scrub'),
  count: document.getElementById('count'),
  caption: document.getElementById('caption')
};

/* ---------- 与父页通信 ---------- */

var MSG = 'lc-demo';

/* 目标 origin：嵌入时从 referrer 取（精确投递）；file:// 下取不到就退回 '*'。
   载荷只有主题名和像素高度，不含敏感信息。 */
var PARENT_ORIGIN = (function () {
  try { return new URL(document.referrer).origin || '*'; } catch (_) { return '*'; }
})();

function post(type, payload) {
  if (window.parent === window) return;   // 双击离线打开时没有父窗口
  var msg = { type: MSG + ':' + type };
  for (var k in (payload || {})) msg[k] = payload[k];
  try { window.parent.postMessage(msg, PARENT_ORIGIN); } catch (_) {}
}

/* ---------- 高度上报 ---------- */

var lastH = 0;
var rafId = 0;

function reportHeight() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(function () {
    rafId = 0;
    var h = Math.ceil(app.getBoundingClientRect().height);
    if (h > 0 && Math.abs(h - lastH) >= 1) {
      lastH = h;
      post('height', { height: h });
    }
  });
}

/* 🔴 只 observe #app。observe documentElement 或 body 会与父页设定的 iframe
      高度互相触发，形成 ResizeObserver 死循环（页面卡顿 + 高度来回抖）。 */
if ('ResizeObserver' in window) new ResizeObserver(reportHeight).observe(app);
window.addEventListener('resize', reportHeight);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(reportHeight);

/* ---------- 播放控制 ---------- */

var BASE_MS = 900;
var SPEEDS = [0.5, 1, 1.5, 2];
var idx = 0;
var playing = false;
var speedIdx = 1;
var timer = null;

function lastIdx() { return steps.length - 1; }

function go(n) {
  idx = Math.max(0, Math.min(lastIdx(), n));
  var s = steps[idx];
  paint(s);
  el.caption.textContent = s.caption;
  el.caption.setAttribute('data-phase', s.phase);
  el.scrub.value = String(idx);
  el.count.textContent = '第 ' + (idx + 1) + ' / ' + steps.length + ' 步';
  el.prev.disabled = idx === 0;
  el.next.disabled = idx === lastIdx();
  var label = playing ? '暂停' : (idx === lastIdx() ? '重播' : '播放');
  el.play.textContent = label;
  el.play.setAttribute('aria-label', label);
  reportHeight();   // 旁白换行会改变高度
}

/* 用 setTimeout 递归而非 setInterval：变速能立刻生效，末尾自动停也精确。 */
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(tick, BASE_MS / SPEEDS[speedIdx]);
}

function tick() {
  if (idx >= lastIdx()) { pause(); return; }
  go(idx + 1);
  if (!playing) return;
  if (idx >= lastIdx()) pause();   // 到末步立即停，按钮马上变「重播」
  else schedule();
}

function play() {
  if (idx >= lastIdx()) go(0);   // 末步点播放 = 重播
  playing = true;
  go(idx);
  schedule();
}

function pause() {
  playing = false;
  clearTimeout(timer);
  go(idx);
}

function toggle() { if (playing) pause(); else play(); }

function reset() { pause(); go(0); }

function stepBy(d) {
  if (playing) pause();
  go(idx + d);
}

el.prev.addEventListener('click', function () { stepBy(-1); });
el.next.addEventListener('click', function () { stepBy(1); });
el.play.addEventListener('click', toggle);
el.reset.addEventListener('click', reset);
el.speed.addEventListener('click', function () {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  el.speed.textContent = SPEEDS[speedIdx] + '×';
  if (playing) schedule();
});
el.scrub.addEventListener('input', function () {
  if (playing) pause();
  go(Number(el.scrub.value));
});

document.addEventListener('keydown', function (e) {
  var t = e.target;
  /* range 上的方向键要留给原生行为，否则进度条拖不动 */
  if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  switch (e.key) {
    case 'ArrowRight': e.preventDefault(); stepBy(1); break;
    case 'ArrowLeft': e.preventDefault(); stepBy(-1); break;
    case ' ': e.preventDefault(); toggle(); break;
    case 'Home': e.preventDefault(); if (playing) pause(); go(0); break;
    case 'End': e.preventDefault(); if (playing) pause(); go(lastIdx()); break;
    case 'r': case 'R': e.preventDefault(); reset(); break;
  }
});

if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  document.documentElement.classList.add('no-motion');
}

/* ---------- 主题同步 ---------- */

window.addEventListener('message', function (e) {
  /* 与 origin 无关的强校验：来源窗口必须是自己的父窗口，且消息形状必须匹配 */
  if (e.source !== window.parent) return;
  var d = e.data;
  if (!d || d.type !== MSG + ':theme') return;
  document.documentElement.classList.toggle('dark', d.theme === 'dark');
  reportHeight();
});

/* ---------- 启动 ---------- */

/* 空步骤是 archetype 编写期的真实失误，直接崩会白屏且难定位，所以给一条明确提示。 */
if (!steps.length) {
  el.caption.textContent = '该演示尚未生成任何步骤，请检查 buildSteps()。';
  el.count.textContent = '第 0 / 0 步';
  el.prev.disabled = el.next.disabled = true;
} else {
  el.scrub.max = String(lastIdx());
  /* 由 iframe 主动喊 ready，父页收到后才回发主题 —— 解决父页抢先 post 被丢掉的竞态。
     必须放在 message 监听器挂好之后。 */
  post('ready', { slug: SLUG, steps: steps.length });
  go(0);
  reportHeight();
}
})();
</script>
</body>
</html>
