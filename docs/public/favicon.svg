<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- 五彩斑斓的斜向渐变：朱红 → 琥珀 → 青绿 → 群青 → 紫罗兰 -->
    <linearGradient id="code" x1="20" y1="80" x2="80" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0512f"/>
      <stop offset="0.28" stop-color="#e8a13c"/>
      <stop offset="0.52" stop-color="#3fae8b"/>
      <stop offset="0.76" stop-color="#5d8fd4"/>
      <stop offset="1" stop-color="#a97bd8"/>
    </linearGradient>
    <!-- 暗色底微光泽 -->
    <radialGradient id="ink" cx="0.5" cy="0.38" r="0.85">
      <stop offset="0" stop-color="#262833"/>
      <stop offset="1" stop-color="#16171f"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="100" height="100" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="100" height="100" fill="url(#ink)"/>
    <!-- 细网格，呼应编辑纸感 -->
    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="0.8">
      <line x1="25" y1="0" x2="25" y2="100"/>
      <line x1="50" y1="0" x2="50" y2="100"/>
      <line x1="75" y1="0" x2="75" y2="100"/>
      <line x1="0" y1="25" x2="100" y2="25"/>
      <line x1="0" y1="50" x2="100" y2="50"/>
      <line x1="0" y1="75" x2="100" y2="75"/>
    </g>
    <!-- 符号的浅色衬影，增加层次 -->
    <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(2,3)">
      <polyline points="37,36 25,50 37,64"/>
      <polyline points="63,36 75,50 63,64"/>
      <line x1="55" y1="32" x2="45" y2="68"/>
    </g>
    <!-- 主体：彩色 </> 符号 -->
    <g stroke="url(#code)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="37,36 25,50 37,64"/>
      <polyline points="63,36 75,50 63,64"/>
      <line x1="55" y1="32" x2="45" y2="68"/>
    </g>
    <!-- 符号上的高光细线 -->
    <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="36,37.5 26,50 36,62.5"/>
      <polyline points="64,37.5 74,50 64,62.5"/>
      <line x1="54" y1="33.5" x2="46" y2="66.5"/>
    </g>
  </g>

  <!-- 边框与琥珀点缀 -->
  <rect x="0.5" y="0.5" width="99" height="99" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="14" cy="14" r="3.2" fill="#e8a13c"/>
</svg>
